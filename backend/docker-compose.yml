version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tour-uzbekistan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tour_uzbekistan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tour-uzbekistan-backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tour_uzbekistan?schema=public
    ports:
      - "3000:3000"

volumes:
  postgres_data:
